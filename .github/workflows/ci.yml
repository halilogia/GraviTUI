name: GraviTUI Python CI & Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Python Lint, Compile & Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and Syntax Check
        run: python -m py_compile run_hub.py

      - name: GravityGuard Secret Leak Check
        run: |
          if git grep -EI "sk-ant-|ghp_|AKIA[0-9A-Z]{16}" -- ':!*.lock'; then
            echo "::error::Potential secret leak detected!"
            exit 1
          fi
